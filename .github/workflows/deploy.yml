name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  # 笔记存放在私有仓库，它的提交不会触发本仓库的 push 事件。
  # 所以这里定时重建；想立刻发布时，到 Actions 页面手动点 "Run workflow"。
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site code
        uses: actions/checkout@v5

      # 论文笔记保存在私有仓库，构建时用只读令牌拉下来。
      # 仓库名改了这里也要一起改。
      - name: Checkout private notes
        uses: actions/checkout@v5
        with:
          repository: Liufuyingjie/blog-content
          token: ${{ secrets.CONTENT_TOKEN }}
          path: .notes

      # 必须排在 npm run check 之前：tests/content.test.ts 会读真实笔记文件。
      - name: Place notes into content/papers
        run: |
          mkdir -p content/papers
          cp -R .notes/content/papers/. content/papers/
          echo "markdown notes found: $(find content/papers -name '*.md' | wc -l)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check content and types
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
